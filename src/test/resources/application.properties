# Test datasource — uses H2 in-memory so no PostgreSQL instance is required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate (H2Dialect is auto-detected, no need to specify it)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Explicitly disable Open Session In View to avoid the startup warning
spring.jpa.open-in-view=false
